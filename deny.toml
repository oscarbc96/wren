[graph]
all-features = false

[advisories]
version = 2
ignore = []
# Unmaintained notices for transitive crates pulled in by GPUI (rustybuzz, ttf-parser,
# zbus family) have no safe upgrade for us; only flag unmaintained direct deps.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  "blessing",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  # libtomcrypt inside sqlcipher-src (bundled SQLCipher).
  "WTFPL",
  # Wren itself and Zed's non-GPUI crates.
  "AGPL-3.0-or-later",
  "GPL-3.0-or-later",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/zed-industries/zed",
  # Git dependencies of GPUI at the pinned rev (Zed forks and wgpu).
  "https://github.com/zed-industries/oo7",
  "https://github.com/zed-industries/font-kit",
  "https://github.com/gfx-rs/wgpu",
]
