[graph]
all-features = false

[advisories]
version = 2
ignore = [
  # Servo 0.8 pins rusqlite 0.38 (bundled SQLite 3.53). Exposure needs a
  # database file written by a less trusted party; Wren only opens its own
  # profile databases. Drop once Servo moves to rusqlite 0.41+.
  { id = "RUSTSEC-2026-0459", reason = "Servo pins libsqlite3-sys 0.36; only own profile DBs are opened" },
  # rsa 0.9.x and transitive crypto-bigint 0.5.x (via p256 0.13) are used
  # only for offline CRX3 signature verification, not network-exposed
  # decryption or signing operations. Upgrade when compatible releases are
  # adopted.
  { id = "RUSTSEC-2023-0071", reason = "extensions uses rsa only for offline CRX3 signature verification" },
  { id = "RUSTSEC-2026-0387", reason = "transitive crypto-bigint used only for offline CRX3 signature verification" },
]
# Unmaintained notices for transitive crates pulled in by GPUI (rustybuzz, ttf-parser,
# zbus family) have no safe upgrade for us; only flag unmaintained direct deps.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  "blessing",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  # LLVM-style permissive licence (libfuzzer-sys via image codecs).
  "NCSA",
  # libtomcrypt inside sqlcipher-src (bundled SQLCipher).
  "WTFPL",
  # Wren itself (and the template code it reuses).
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
