[package]
name = "wren"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wren"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
adblock_rules = { path = "../adblock_rules" }
tabs = { path = "../tabs" }
store = { path = "../store" }
omnibox = { path = "../omnibox" }
settings = { path = "../settings" }
themes = { path = "../themes" }
gpui = { workspace = true }
gpui_platform = { workspace = true, default-features = false, features = ["font-kit"] }
clap = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
raw-window-handle = { workspace = true }
rustls = { version = "0.23", features = ["aws_lc_rs"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
engine = { path = "../engine" }
store = { path = "../store" }
tabs = { path = "../tabs" }
tempfile.workspace = true
url.workspace = true
jiff.workspace = true
servo = { workspace = true }
winit = "0.30"
proc-macro2 = "=1.0.103"
objc2 = "0.6"
objc2-foundation = "0.3"
embedder-traits = { package = "servo-embedder-traits", version = "=0.8.0" }
tracing = "0.1"
sysinfo = { workspace = true }
