[package]
name = "wren"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wren"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
adblock_rules = { path = "../adblock_rules" }
tabs = { path = "../tabs" }
store = { path = "../store" }
omnibox = { path = "../omnibox" }
settings = { path = "../settings" }
themes = { path = "../themes" }
creds = { path = "../creds" }
cdp = { path = "../cdp" }
async-trait = "0.1"
gpui = { workspace = true }
gpui_platform = { workspace = true, default-features = false, features = ["font-kit"] }
clap = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
raw-window-handle = { workspace = true }
core-graphics = "0.24"
foreign-types = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
sysinfo = { workspace = true }
reqwest = { workspace = true }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
engine = { path = "../engine" }
store = { path = "../store" }
tabs = { path = "../tabs" }
tempfile.workspace = true
url.workspace = true
jiff.workspace = true
servo = { workspace = true }
winit = "0.30"
proc-macro2 = "=1.0.103"
objc2 = "0.6"
objc2-foundation = "0.3"
embedder-traits = { package = "servo-embedder-traits", version = "=0.8.0" }
tracing = "0.1"
sysinfo = { workspace = true }
reqwest = { workspace = true }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-tungstenite = "0.26"

[package.metadata.packager]
product-name = "Wren"
identifier = "io.github.oscarbc96.wren"
icons = ["../../assets/macos/wren.icns"]
formats = ["app"]

[package.metadata.packager.macos]
minimum-system-version = "14.0"
