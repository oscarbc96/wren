name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  CARGO_TERM_COLOR: always
  # Line tables keep backtraces readable but shrink target/ (and the cache) a lot.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Set up tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      - name: Cargo deny
        run: mise exec -- cargo deny check
      - name: Repo tooling tests
        run: mise run test:repo
