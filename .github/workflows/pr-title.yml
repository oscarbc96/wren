name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          title="${PR_TITLE}"
          regex='^(feat|fix|perf|docs|refactor|test|ci|build|chore|revert)(\([^)]+\))?!?: .+'
          if [[ ! "$title" =~ $regex ]]; then
            echo "::error::PR title is not a Conventional Commit: $title"
            exit 1
          fi
          echo "OK: $title"
