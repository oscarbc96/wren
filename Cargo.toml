[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"

# GPUI and reused Zed crates share one Zed git rev (spec section 3, Dependencies).
[workspace.dependencies]
servo = "=0.8.0"
# UI: GPUI-CE (Apache-2.0) from crates.io, pinned exactly and bumped by hand.
gpui = { package = "gpui-ce", version = "=0.3.0" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", features = ["font-kit"] }
gpui_elements = { package = "gpui_ce_elements", version = "=0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
notify = "8.2"
notify-debouncer-full = "0.7"
schemars = "1.0"
serde_path_to_error = "0.1"
thiserror = "2"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
url = "2"
jiff = "0.2"
raw-window-handle = "0.6"
objc2-app-kit = "0.3"
psl = "2"
idna = "1"
unicode-script = "0.5"
sysinfo = "0.40"
rusqlite = { version = "0.38", features = ["bundled"] }
rusqlite_migration = "2.7"
insta = "1.49"
tempfile = "3"
dirs = "7"

# Keep debug builds small on disk: line tables keep backtraces readable,
# dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[patch.crates-io]
zed-font-kit = { path = "vendor/zed-font-kit" }
stylo_derive = { path = "vendor/stylo_derive" }
gpui_ce_macos = { path = "vendor/gpui_ce_macos" }
